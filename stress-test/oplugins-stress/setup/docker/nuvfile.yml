version: '3'

vars:
  INGRESS: "https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml"

env:
  DATADIR:
    sh: echo $NUV_TMP/kind
  KUBECONFIG: 
    sh: |- 
        if test -e "$NUV_TMP/kubeconfig"
        then echo "$NUV_TMP/kubeconfig"
        else echo ~/.kube/config
        fi

tasks:

  status:
    silent: true
    desc: status of the OpenServerless cluster in Docker
    cmds:
    - |
      if kind get clusters | grep openserverless
      then echo Cluster OpenServerless up and running
      else echo Cluster OpenServerless not found
      fi

  info:
    silent: true
    desc: info the OpenServerless cluster in Docker
    cmds:
    - |
      echo "=== KUBECONFIG"
      echo $KUBECONFIG
      echo "=== Kind Version"
      kind version
      echo "=== Kind Clusters"
      kind get clusters 
      if test -e $KUBECONFIG
      then  echo "=== Nodes"
            kubectl get nodes
      fi

  cluster:
    silent: true
    cmds:
    - mkdir -p $DATADIR
    - envsubst -i kind.yaml -o _kind.yaml
    - > 
      kind create cluster 
      --kubeconfig="$NUV_TMP/kubeconfig" 
      --wait=1m --name=openserverless 
      --config=_kind.yaml

  ingress:
    silent: true
    cmds:
    - > 
      kubectl --kubeconfig="$NUV_TMP/kubeconfig" 
      apply -f ingress-deploy.yaml

  create:
    silent: true
    desc: create the OpenServerless cluster in Docker
    cmds:
    - task: cluster
    - task: ingress
    - cp "$NUV_TMP/kubeconfig" "$NUV_TMP/kind.kubeconfig"
    status:
    - kind get clusters | grep openserverless

  delete:
    silent: true
    desc: destroy the OpenServerless cluster in Docker
    cmds:
    - kind delete clusters openserverless
    - rm "$KUBECONFIG" "$NUV_TMP/kind.kubeconfig"

  kubeconfig:
    desc: export kubeconfig
    silent: true
    cmds:
    - kind export kubeconfig --name=openserverless --kubeconfig "$NUV_TMP/kubeconfig"
    - cp "$NUV_TMP/kubeconfig" "$NUV_TMP/kind.kubeconfig"
